# Shared tmux/psmux bindings and Rose Pine Moon styling.
set -g mouse on
set -g focus-events on
set -g history-limit 50000
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind C-t
unbind C-b
# Press backtick, then a tmux command; press it twice for a literal backtick.
set -g prefix '`'
bind '`' send-prefix
bind r source-file "@ENTRY@" \; display-message "Reloaded"
bind y split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Create side-by-side panes directly with Alt/Option + V.
bind -n M-v split-window -h -c "#{pane_current_path}"
# Switch panes directly with Alt/Option + H/J/K/L.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R
bind z resize-pane -Z

set -g status-style "bg=#2a273f,fg=#e0def4"
set -g pane-border-style "fg=#44415a"
set -g pane-active-border-style "fg=#c4a7e7"
set -g message-style "bg=#393552,fg=#f6c177"
setw -g window-status-style "fg=#908caa,bg=#2a273f"
setw -g window-status-current-style "fg=#232136,bg=#c4a7e7,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g status-left "#[fg=#ea9a97,bold] #S "
set -g status-right "#[fg=#9ccfd8]%H:%M "
